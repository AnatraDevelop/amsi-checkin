<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Check-In System - AMSI Riau</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      width: 100%;
      max-width: 550px;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 1px solid #334155;
    }
    h2 { color: #38bdf8; margin: 0 0 6px 0; font-size: 22px; }
    p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 2px solid #38bdf8;
      min-height: 250px;
      color: #fff;
    }
    #reader button {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 0;
    }
    #reader video {
      width: 100% !important;
      height: auto !important;
      border-radius: 8px;
    }

    #result-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 14px;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .success { background-color: #064e3b; color: #a7f3d0; border: 2px solid #10b981; }
    .warning { background-color: #78350f; color: #fde68a; border: 2px solid #f59e0b; }
    .error { background-color: #7f1d1d; color: #fecaca; border: 2px solid #ef4444; }
    .nama { font-size: 24px; font-weight: bold; margin-bottom: 4px; }
    .instansi { font-size: 16px; opacity: 0.9; margin-bottom: 10px; }
    .msg { font-size: 15px; font-weight: 600; }

    #status-line {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <div class="card">
    <h2>E-TICKET CHECK-IN</h2>
    <p class="subtitle">Arahkan QR Code E-Ticket ke Kamera Tablet</p>

    <div id="reader"></div>

    <div id="result-box">
      <div id="res-nama" class="nama"></div>
      <div id="res-instansi" class="instansi"></div>
      <div id="res-msg" class="msg"></div>
    </div>

    <div id="status-line">Menghubungkan ke server...</div>
  </div>

  <script>
    // =====================================================================
    // GANTI DENGAN URL WEB APP APPS SCRIPT ANDA (yang berakhiran /exec)
    // =====================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlTBeRm4B3SBayZGPj27_HWcXAzgTo4LBzA4Mj5JePw_P0uTC0UhRnKDU8YxlgQGO4/exec";

    let isProcessing = false;
    const statusLine = document.getElementById('status-line');

    function playAudioBeep() {
      try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      playAudioBeep();
      statusLine.innerText = "Memproses...";

      // Pakai Content-Type: text/plain agar browser TIDAK mengirim
      // preflight OPTIONS (Apps Script tidak mendukung doOptions).
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ qrText: decodedText })
      })
        .then(res => res.json())
        .then(showResult)
        .catch(err => {
          statusLine.innerText = "Gagal terhubung ke server: " + err.message;
          isProcessing = false;
        });
    }

    function showResult(res) {
      let box = document.getElementById('result-box');
      let namaEl = document.getElementById('res-nama');
      let instansiEl = document.getElementById('res-instansi');
      let msgEl = document.getElementById('res-msg');

      box.style.display = 'block';
      statusLine.innerText = "";

      if (res.status === 'SUCCESS') {
        box.className = 'success';
        namaEl.innerText = res.nama;
        instansiEl.innerText = res.instansi;
        msgEl.innerText = "✓ " + res.message;
      } else if (res.status === 'ALREADY_CHECKED_IN') {
        box.className = 'warning';
        namaEl.innerText = res.nama;
        instansiEl.innerText = res.instansi;
        msgEl.innerText = "⚠️ " + res.message;
      } else {
        box.className = 'error';
        namaEl.innerText = "";
        instansiEl.innerText = "";
        msgEl.innerText = "❌ " + res.message;
      }

      setTimeout(() => {
        box.style.display = 'none';
        isProcessing = false;
        statusLine.innerText = "Siap memindai...";
      }, 3500);
    }

    document.addEventListener("DOMContentLoaded", function () {
      statusLine.innerText = "Siap memindai...";
      let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          rememberLastUsedCamera: true,
          supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
        },
        /* verbose= */ false
      );

      html5QrcodeScanner.render(onScanSuccess);
    });
  </script>
</body>
</html>
